<svg xmlns="http://www.w3.org/2000/svg" viewBox="350 0 500 340" width="1200" height="340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1d26"/><stop offset="1" stop-color="#0f1115"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="80%" r="55%"><stop offset="0" stop-color="#f2b84b" stop-opacity=".55"/><stop offset=".6" stop-color="#e8632b" stop-opacity=".15"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b9c0cc"/><stop offset=".5" stop-color="#f3f5f8"/><stop offset="1" stop-color="#8d95a3"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe29a"/><stop offset="1" stop-color="#c98a1f"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#glow)"/>
  <!-- sparks -->
  <g fill="#ffd27a" opacity=".9">
    <circle cx="560" cy="150" r="2"/><circle cx="640" cy="120" r="1.5"/><circle cx="600" cy="90" r="2.5"/><circle cx="700" cy="160" r="1.5"/>
    <circle cx="520" cy="110" r="1.5"/><circle cx="670" cy="70" r="2"/><circle cx="590" cy="190" r="1.5"/><circle cx="630" cy="200" r="2"/>
  </g>
  <!-- anvil -->
  <g transform="translate(600,250)">
    <path d="M-130,-30 h260 l-30,30 h-200 z" fill="#3a3f4b"/>
    <path d="M-160,-40 h320 l-20,10 h-280 z" fill="#4a5060"/>
    <rect x="-60" y="0" width="120" height="40" fill="#2c303a"/>
    <rect x="-90" y="40" width="180" height="16" fill="#23262e"/>
    <ellipse cx="0" cy="-42" rx="150" ry="10" fill="#f2b84b" opacity=".35" filter="url(#blur)"/>
  </g>
  <!-- weapons fanned above the anvil -->
  <g transform="translate(600,200)" stroke="#0b0c10" stroke-width="2" stroke-linejoin="round">
    <!-- sword -->
    <g transform="rotate(-18)">
      <path d="M-8,-180 L0,-200 L8,-180 L8,-20 L-8,-20 Z" fill="url(#steel)"/>
      <rect x="-28" y="-22" width="56" height="10" rx="3" fill="url(#gold)"/>
      <rect x="-6" y="-12" width="12" height="40" fill="#5a3a22"/>
      <circle cx="0" cy="34" r="8" fill="url(#gold)"/>
    </g>
    <!-- axe -->
    <g transform="rotate(16)">
      <rect x="-5" y="-170" width="10" height="200" fill="#5a3a22"/>
      <path d="M5,-165 C60,-175 80,-120 70,-80 C45,-90 25,-85 5,-70 Z" fill="url(#steel)"/>
      <path d="M-5,-165 C-60,-175 -80,-120 -70,-80 C-45,-90 -25,-85 -5,-70 Z" fill="url(#steel)"/>
    </g>
    <!-- staff -->
    <g transform="rotate(-42)">
      <rect x="-4" y="-150" width="8" height="190" fill="#3b2a1a"/>
      <circle cx="0" cy="-162" r="16" fill="#7fd3ff" opacity=".95"/>
      <circle cx="0" cy="-162" r="26" fill="#7fd3ff" opacity=".25" filter="url(#blur)"/>
    </g>
    <!-- bow -->
    <g transform="rotate(40)">
      <path d="M0,-170 C70,-120 70,-20 0,30" fill="none" stroke="#6b4a2b" stroke-width="9"/>
      <path d="M0,-170 L0,30" stroke="#e8e8ec" stroke-width="1.5"/>
    </g>
    <!-- shield -->
    <g transform="translate(0,-60)">
      <path d="M0,-70 L60,-50 C62,10 35,50 0,70 C-35,50 -62,10 -60,-50 Z" fill="#8a2d2d"/>
      <path d="M0,-55 L45,-40 C46,5 26,36 0,52 C-26,36 -46,5 -45,-40 Z" fill="#b53a3a"/>
      <path d="M0,-45 L0,40 M-32,-18 L32,-18" stroke="url(#gold)" stroke-width="8"/>
    </g>
  </g>
</svg>

